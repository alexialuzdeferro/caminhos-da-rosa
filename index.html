<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caminhos da Rosa | Oráculo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --vinho: #4a0404; --dourado: #c5a059; --preto: #0a0a0a; --cinza: #1a1a1a; --texto: #f5f5f5; }
        body { background-color: var(--preto); color: var(--texto); font-family: 'Quicksand', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1, h3, h4 { font-family: 'Cinzel', serif; color: var(--dourado); text-transform: uppercase; text-align: center; }
        header { padding: 2rem; width: 100%; border-bottom: 1px solid var(--dourado); background: #1a0202; text-align: center; box-sizing: border-box; }
        .container { width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; }
        .section-box { background: var(--cinza); padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 25px; box-sizing: border-box; width: 100%; }
        
        /* Oráculo e Rosas */
        .roses { display: flex; justify-content: space-around; font-size: 3rem; margin: 20px 0; }
        .rose { cursor: pointer; transition: 0.3s; }
        #msg-display { display: none; padding: 15px; background: rgba(74, 4, 4, 0.6); border-radius: 8px; border-left: 4px solid var(--dourado); margin-bottom: 15px; font-style: italic; text-align: center; }
        
        /* Botão de Curtir (Saravás) */
        .btn-like-minimal { background: rgba(255,255,255,0.05); border: 1px solid #444; color: #999; padding: 8px 20px; border-radius: 30px; cursor: pointer; font-size: 0.8rem; display: block; margin: 0 auto; transition: 0.3s; }
        .btn-like-minimal.active { border-color: var(--dourado); color: var(--dourado); background: rgba(197, 160, 89, 0.1); }

        /* Formulário Ajustado (Fim do "torto") */
        .quiz-opt { width: 100%; padding: 14px; margin: 10px 0; background: #222; color: white; border: 1px solid #444; border-radius: 10px; font-family: inherit; box-sizing: border-box; display: block; }
        .btn-main { background: var(--dourado); color: var(--preto); border: none; padding: 16px; width: 100%; font-weight: bold; border-radius: 30px; cursor: pointer; text-transform: uppercase; font-family: 'Cinzel', serif; margin-top: 10px; box-sizing: border-box; }
        .privacy-box { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 0.8rem; color: #888; margin: 15px 0; width: 100%; }

        /* Rodapé e Links */
        footer { margin-top: auto; padding: 2rem 1rem; width: 100%; background: #050505; border-top: 1px solid #222; text-align: center; box-sizing: border-box; }
        .footer-social { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .footer-social a { color: var(--dourado); text-decoration: none; font-size: 0.9rem; font-weight: bold; border: 1px solid var(--dourado); padding: 8px 15px; border-radius: 5px; }
    </style>
</head>
<body>

    <header><h1>Caminhos da Rosa</h1></header>

    <div class="container">
        <div class="section-box">
            <p style="text-align:center; font-size: 0.9rem;">Sinta a energia e toque em uma rosa:</p>
            <div class="roses">
                <span class="rose" onclick="obterMensagem('vermelha')">🌹</span>
                <span class="rose" onclick="obterMensagem('preta')">🥀</span>
                <span class="rose" onclick="obterMensagem('amarela')">🌻</span>
            </div>
            <div id="msg-display"><span id="msg-text"></span></div>
            <button class="btn-like-minimal" onclick="darLike()" id="btn-like">❤️ <span id="like-count">...</span> SARAVÁS</button>
        </div>

        <div class="section-box">
            <h3>Relate sua Graça</h3>
            <input type="text" id="depo-nome" placeholder="Seu nome" class="quiz-opt">
            <textarea id="depo-msg" placeholder="Como as Moças te ajudaram?" class="quiz-opt" style="height:100px; resize: none;"></textarea>
            
            <div class="privacy-box">
                <input type="checkbox" id="depo-publico" checked>
                <label for="depo-publico">Autorizo publicar este relato na grade.</label>
            </div>
            
            <button class="btn-main" onclick="enviarDepoimento()">Enviar para a Grade</button>
        </div>
    </div>

    <footer>
        <div id="view-counter" style="color:var(--dourado); margin-bottom:10px;">...</div>
        <div class="footer-social">
            <a id="share-wa" href="#" target="_blank">WhatsApp</a>
            <a id="share-tg" href="#" target="_blank">Telegram</a>
        </div>
        <p style="margin-top:20px; font-size: 0.7rem; opacity: 0.4;">Laroyê, Minha Senhora! ✨ 2026</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://rbygxkbewzknvjjhxdvw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJieWd4a2Jld3prbnZqamh4ZHZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwMDcxNjQsImV4cCI6MjA4MTU4MzE2NH0.YrHF9HEGo6yv9MyNsPzFgBhaAB1DRh2SLU8f7L6s1nY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function iniciar() {
            // Views
            const { data: v } = await _supabase.rpc('increment_page_view', { target_page: 'pombagiras' });
            if(v) document.getElementById('view-counter').innerText = `${v} caminhos cruzados por aqui`;

            // Likes (Usando o ID do seu print)
            const { data: l } = await _supabase.from('page_likes').select('likes').eq('page_id', 'trans-pride-main').single();
            if(l) document.getElementById('like-count').innerText = l.likes;

            configurarCompartilhamento();
        }

        async function darLike() {
            // Chamando a função que você rodou no SQL Editor
            const { data, error } = await _supabase.rpc('increment_page_like', { target_page: 'trans-pride-main' });
            if(!error) {
                document.getElementById('like-count').innerText = data;
                document.getElementById('btn-like').classList.add('active');
            }
        }

        async function obterMensagem(cor) {
            const display = document.getElementById('msg-display');
            display.style.display = 'block';
            let { data } = await _supabase.from('mensagens_oraculo').select('texto').eq('cor_rosa', cor).eq('ativa', true);
            if(data) document.getElementById('msg-text').innerText = data[Math.floor(Math.random() * data.length)].texto;
        }

        async function enviarDepoimento() {
            const nome = document.getElementById('depo-nome').value;
            const msg = document.getElementById('depo-msg').value;
            if(!nome || !msg) return alert("Preencha os campos.");
            await _supabase.from('depoimentos').insert([{ nome, mensagem: msg, aprovado: false }]);
            alert("Sua graça foi enviada para moderação. Gratidão!");
            document.getElementById('depo-nome').value = ''; document.getElementById('depo-msg').value = '';
        }

        function configurarCompartilhamento() {
            const url = encodeURIComponent(window.location.href);
            const txt = encodeURIComponent("Receba seu conselho das Pombagiras: ");
            document.getElementById('share-wa').href = `https://api.whatsapp.com/send?text=${txt}%20${url}`;
            document.getElementById('share-tg').href = `https://t.me/share/url?url=${url}&text=${txt}`;
        }

        iniciar();
    </script>
</body>
</html>
